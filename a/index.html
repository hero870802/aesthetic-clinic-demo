/* A: premium template theme — warm neutrals, serif display, bento hero, arch frames */
:root{
  --bg:#FBF9F6; --surface:#F3EEE8; --surface-2:#E9E1D8; --ink:#1E2A30; --muted:#5F6B70; --primary:#2F5B66; --primary-d:#23464F;
  --accent:#B08D6E; --accent-text:#8A6A4C; --accent-soft:#E7D8CB; --line:#E2DAD0; --dark:#17242A; --warn-bg:#F8EFEA;
  --r:16px; --f-sans:"Manrope","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; --f-serif:"Noto Serif TC","Songti TC",serif; --f-lat:"Marcellus","Noto Serif TC",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased}
a{color:var(--primary)}
h1,h2,h3,h4{line-height:1.35;text-wrap:balance;margin:0;font-weight:600;letter-spacing:.02em}
h1,h2{font-family:var(--f-serif);font-weight:500}
p{margin:0}
img{max-width:100%}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
.demobar{background:var(--dark);color:#DCE3E5;font-size:13px;padding-block:8px}
.demobar .wrap:first-child{display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:space-between}
.demobar a{color:#fff;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.demobar .fic{opacity:.65;font-size:12px;margin-top:2px}
.topbar{background:var(--surface);font-size:13px;color:var(--muted);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:7px}
.topbar span{display:inline-flex;gap:6px;align-items:center}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(251,249,246,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid transparent;transition:border-color .2s,box-shadow .2s}
.hdr.small{border-color:var(--line);box-shadow:0 8px 24px -18px rgba(30,42,48,.35)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:84px;transition:min-height .2s}
.hdr.small .wrap{min-height:66px}
.logo{display:flex;flex-direction:column;text-decoration:none;color:var(--ink);line-height:1.15}
.logo-zh{font-family:var(--f-serif);font-size:23px;font-weight:600;letter-spacing:.2em}
.logo-en{font-family:var(--f-lat);font-size:11px;letter-spacing:.42em;color:var(--accent-text)}
.logo.light{color:#fff}.logo.light .logo-en{color:var(--accent)}
.nav{display:flex;align-items:center;gap:2px}
.nav a{color:var(--ink);text-decoration:none;padding:8px 13px;font-size:15px;position:relative}
.nav a:not(.btn)::after{content:"";position:absolute;left:13px;right:13px;bottom:2px;height:1px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .25s}
.nav a:not(.btn):hover::after,.nav a.is-current:not(.btn)::after{transform:scaleX(1)}
.nav a.is-current:not(.btn){color:var(--primary)}
.burger{display:none;background:none;border:0;width:44px;height:44px;padding:12px 10px;cursor:pointer;flex-direction:column;justify-content:space-between}
.burger span:not(.sr-only){display:block;height:1.5px;background:var(--ink);border-radius:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--primary);color:#fff;text-decoration:none;border:1px solid var(--primary);padding:13px 28px;border-radius:999px;font:inherit;font-weight:600;font-size:15px;letter-spacing:.04em;cursor:pointer;transition:background .2s,color .2s,border-color .2s,transform .2s}
.btn:hover{background:var(--primary-d);border-color:var(--primary-d)}
.btn.sm{padding:9px 20px;font-size:14px;color:#fff!important;margin-left:10px}
.btn.line{background:transparent;color:var(--primary);border-color:var(--primary)}
.btn.line:hover{background:var(--primary);color:#fff}
.btn.light{background:#fff;color:var(--primary-d);border-color:#fff}
.btn.light:hover{background:var(--accent-soft);border-color:var(--accent-soft)}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.6)}
.btn.ghost:hover{background:rgba(255,255,255,.14)}
.btn svg{transition:transform .2s}.btn:hover svg{transform:translateX(3px)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.lnk{display:inline-flex;gap:8px;align-items:center;font-weight:600;font-size:14px;color:var(--primary);text-decoration:none;margin-top:auto}
#app{transition:opacity .16s}#app.fade{opacity:0}
/* photo frames */
.pic{position:relative;margin:0;overflow:hidden;border-radius:var(--r);background:var(--surface-2);aspect-ratio:4/3}
.pic img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.pic figcaption,.pic-tag,.banner-tag{position:absolute;left:10px;bottom:10px;font-size:11px;line-height:1.4;letter-spacing:.06em;color:#fff;background:rgba(23,36,42,.55);padding:2px 8px;border-radius:4px;backdrop-filter:blur(4px);pointer-events:none;z-index:2}
.pic figcaption:empty{display:none}
.r43{aspect-ratio:4/3}.r54{aspect-ratio:5/4}.r169{aspect-ratio:16/9}.r34{aspect-ratio:3/4}.r11{aspect-ratio:1}
.arch{aspect-ratio:4/5;border-radius:999px 999px var(--r) var(--r)}
.pic.fill{position:absolute;inset:0;aspect-ratio:auto;border-radius:0}
.pic.avatar{width:60px;aspect-ratio:1;border-radius:50%;flex:none}
a:hover .pic img,.card:hover .pic img{transform:scale(1.04)}
/* hero */
.hero{padding-block:20px 0}
.hero-grid{display:grid;grid-template-columns:minmax(0,2.1fr) minmax(0,1fr);gap:20px}
.hero-main{position:relative;border-radius:24px;overflow:hidden;min-height:600px;display:flex;align-items:flex-end;isolation:isolate}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;animation:kb 18s ease-out both}
.hero-main::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(23,36,42,.78) 0%,rgba(23,36,42,.45) 50%,rgba(23,36,42,.05) 100%),linear-gradient(0deg,rgba(23,36,42,.45),transparent 50%)}
@keyframes kb{from{transform:scale(1.08)}to{transform:scale(1)}}
.hero-t{padding:56px 56px 72px;max-width:640px;color:#fff;display:flex;flex-direction:column;gap:20px}
.hero-t .eyebrow{color:var(--accent-soft)}
.hero h1{font-size:clamp(36px,5vw,62px);letter-spacing:.08em;line-height:1.25}
.hero-t>p:not(.eyebrow){color:rgba(255,255,255,.86);max-width:30em}
.hero-t>*{animation:up .9s cubic-bezier(.2,.7,.2,1) both}.hero-t>:nth-child(2){animation-delay:.1s}.hero-t>:nth-child(3){animation-delay:.2s}.hero-t>:nth-child(4){animation-delay:.3s}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.hero-main .pic-tag{left:16px;bottom:16px}
.badge{position:absolute;right:36px;bottom:36px;width:128px;height:128px;border-radius:50%;background:rgba(251,249,246,.94);display:grid;place-items:center;color:var(--primary-d)}
.badge svg{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);animation:spin 26s linear infinite}
.badge text{font-family:var(--f-lat);font-size:9.6px;letter-spacing:.24em;fill:var(--accent-text)}
.badge span{font-family:var(--f-serif);font-size:15px;line-height:1.35;text-align:center;letter-spacing:.12em}
@keyframes spin{to{transform:rotate(360deg)}}
.hero-side{display:grid;grid-template-rows:auto 1fr;gap:20px}
.hcard{border-radius:24px;padding:32px;position:relative;overflow:hidden}
.hours-card{background:var(--primary);color:#fff;display:flex;flex-direction:column;gap:6px}
.hours-card h2{font-size:26px}.hours-card .eyebrow{color:var(--accent-soft)}
.hours-card .hours div{border-color:rgba(255,255,255,.22)}.hours-card .hours dt{color:rgba(255,255,255,.75)}
.hours-card .lnk{color:#fff;margin-top:16px}
.photo-card{display:flex;align-items:flex-end;min-height:260px;color:#fff;text-decoration:none;isolation:isolate}
.photo-card .pic.fill{z-index:-1}
.photo-card::before{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(0deg,rgba(23,36,42,.75),rgba(23,36,42,0) 65%);pointer-events:none}
.photo-card .pic figcaption{left:auto;right:10px;bottom:auto;top:10px}
.pc-t{position:relative;z-index:1}.pc-t h2{font-size:24px}.pc-t .eyebrow{color:var(--accent-soft)}.pc-t p:last-child{font-size:14px;opacity:.85}
/* fact strip */
.facts{padding-block:20px 0}
.facts-in{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border-radius:24px;padding:34px 12px}
.facts-in>div{padding:0 28px;border-left:1px solid var(--line)}.facts-in>div:first-child{border:0}
.fact-n{font-family:var(--f-lat);font-size:54px;line-height:1;color:var(--primary-d);display:flex;align-items:baseline;gap:8px}
.fact-n small{font-family:var(--f-sans);font-size:15px;color:var(--ink);font-weight:600}
.facts-in p:last-child{color:var(--muted);font-size:14px;margin-top:8px}
/* sections */
.sec{padding-block:104px}.feat-sec{padding-top:64px}.sec.tight{padding-block:64px 96px}.sec.alt{background:var(--surface)}
.sec-h{margin-bottom:48px;display:flex;flex-direction:column;gap:12px}
.sec-h.center{text-align:center;align-items:center}.sec-h.center p{max-width:36em}
.sec-h h2,.intro-t h2,.split h2,.handover h2,.cta-in h2{font-size:clamp(28px,3.4vw,42px);letter-spacing:.06em}
.sec-h p{color:var(--muted)}
.row-between{flex-direction:row;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px}
.row-between>div{display:flex;flex-direction:column;gap:12px}
.eyebrow{font-family:var(--f-lat);color:var(--accent-text);font-size:14px;letter-spacing:.24em;text-transform:uppercase;display:inline-flex;align-items:center;gap:12px}
.eyebrow::before{content:"";width:28px;height:1px;background:currentColor}
.sec-h.center .eyebrow::after{content:"";width:28px;height:1px;background:currentColor}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
/* features */
.feat4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
.f4{padding:36px 28px;border:1px solid var(--line);border-radius:var(--r);background:#fff;display:flex;flex-direction:column;gap:12px;transition:transform .3s,box-shadow .3s,border-color .3s}
.f4:hover{transform:translateY(-4px);box-shadow:0 22px 40px -28px rgba(30,42,48,.4);border-color:var(--accent-soft)}
.ico{width:60px;height:60px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;color:var(--primary-d)}
.ico svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.f4 h3{font-family:var(--f-serif);font-size:20px;font-weight:500}.f4 p{color:var(--muted);font-size:15px}
/* split intro */
.split-intro{display:grid;grid-template-columns:1fr 1fr;gap:88px;align-items:center}
.stack{position:relative;padding:0 18% 14% 0}
.stack .over{position:absolute;right:0;bottom:0;width:46%;border:8px solid var(--surface);border-radius:var(--r)}
.intro-t{display:flex;flex-direction:column;gap:20px}
.intro-t>p{color:var(--muted);font-size:17px}
.intro-t .btn{align-self:flex-start;margin-top:8px}
.checks,.dots{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.checks li,.dots li{padding-left:28px;position:relative}
.checks li::before{content:"";position:absolute;left:2px;top:.5em;width:12px;height:7px;border-left:1.5px solid var(--accent-text);border-bottom:1.5px solid var(--accent-text);transform:rotate(-45deg)}
.checks li b{display:block;font-weight:600}
.split-intro .checks li{color:var(--muted);font-size:15px}.split-intro .checks li b{color:var(--ink);font-size:16px}
.dots li::before{content:"";position:absolute;left:8px;top:.72em;width:6px;height:6px;border-radius:50%;background:var(--accent)}

/* Shared router, state and backend mock. Each version defines window.V (renderer). */
const S = { pub: Object.fromEntries(TREATMENTS.map(t => [t.id, true])), hero: 0, picker: false, toast: '' };
const pubT = () => TREATMENTS.filter(t => S.pub[t.id]);

const PAGE_NAMES = { home: '首頁', treatments: '療程項目', doctors: '醫師團隊', articles: '最新消息', about: '關於診所', contact: '預約諮詢', backend: '後台操作說明' };
const NAV = ['treatments', 'doctors', 'articles', 'about', 'contact'];

function parseRoute() {
  const h = (location.hash || '#home').slice(1);
  if (ROUTES.includes(h)) return { view: h };
  if (h.startsWith('t-') && tById(h.slice(2))) return { view: 'treatment', item: tById(h.slice(2)) };
  if (h.startsWith('a-') && aById(h.slice(2))) return { view: 'article', item: aById(h.slice(2)) };
  return { view: 'home' };
}

function pageTitle(r) {
  const base = r.item ? (r.item.name || r.item.title) : PAGE_NAMES[r.view];
  return (r.view === 'home' ? CLINIC.name + '｜' + CLINIC.tagline : base + '｜' + CLINIC.name) + '（示意）';
}

function renderView(r) {
  if (r.view === 'treatment' && !S.pub[r.item.id]) return V.unpublished(r.item);
  if (r.view === 'treatment') return V.treatment(r.item);
  if (r.view === 'article') return V.article(r.item);
  if (r.view === 'backend') return V.backend(backendHTML());
  return V[r.view]();
}

let firstRender = true;
function route(opts = {}) {
  const r = parseRoute();
  const app = document.getElementById('app');
  const paint = () => {
    app.innerHTML = renderView(r);
    document.title = pageTitle(r);
    if (!opts.keepScroll) window.scrollTo(0, 0);
    document.querySelectorAll('[data-nav]').forEach(a => {
      const cur = a.dataset.nav === r.view || (r.view === 'treatment' && a.dataset.nav === 'treatments') || (r.view === 'article' && a.dataset.nav === 'articles');
      a.classList.toggle('is-current', cur);
      if (cur) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    bindCommon(app);
    V.after && V.after(r, app, firstRender);
    if (!firstRender && !opts.keepScroll) { const h1 = app.querySelector('h1'); if (h1) { h1.setAttribute('tabindex', '-1'); h1.focus({ preventScroll: true }); } }
    firstRender = false;
  };
  if (!firstRender && !opts.keepScroll && V.transition) V.transition(paint); else paint();
}

function bindCommon(root) {
  root.querySelectorAll('form[data-demo-form]').forEach(f => f.addEventListener('submit', e => {
    e.preventDefault();
    const st = f.querySelector('[role="status"]');
    if (!f.checkValidity()) { f.reportValidity(); return; }
    st.textContent = '此為示範網站，資料並未送出。正式網站將寄送至診所信箱並寫入後台「聯絡表單紀錄」。';
    st.hidden = false;
  }));
  root.querySelectorAll('[data-filter]').forEach(btn => btn.addEventListener('click', () => {
    const c = btn.dataset.filter;
    root.querySelectorAll('[data-filter]').forEach(b => b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'));
    root.querySelectorAll('[data-cat]').forEach(el => { el.hidden = !(c === 'all' || el.dataset.cat === c); });
  }));
  // backend interactions
  root.querySelectorAll('[data-toggle-pub]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.togglePub; S.pub[id] = !S.pub[id];
    S.toast = S.pub[id] ? `「${tById(id).name}」已重新發布，前台療程列表與首頁已恢復顯示。` : `「${tById(id).name}」已轉為草稿（下架）。到前台療程列表看看，它已經不見了；內容仍保留在後台。`;
    route({ keepScroll: true });
  }));
  root.querySelectorAll('[data-open-picker]').forEach(b => b.addEventListener('click', () => { S.picker = !S.picker; route({ keepScroll: true }); }));
  root.querySelectorAll('[data-pick]').forEach(b => b.addEventListener('click', () => {
    S.hero = +b.dataset.pick; S.picker = false; S.toast = '首頁主視覺已更換。回到首頁就能看到新的圖片。'; route({ keepScroll: true });
  }));
  const chk = root.querySelector('#wp-summary');
  if (chk) {
    const out = root.querySelector('#wp-summary-check');
    const run = () => {
      const v = chk.value; const hits = BANNED.filter(w => v.includes(w));
      const count = root.querySelector('#wp-summary-count'); count.textContent = `${[...v].length} / 40 字`;
      if (!hits.length) { out.className = 'wp-check ok'; out.textContent = '用詞檢查通過，可以發布。'; return; }
      const re = new RegExp('(' + hits.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'g');
      const safe = v.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
      out.className = 'wp-check warn';
      out.innerHTML = '<strong>發布前提醒：</strong>以下標示的詞語可能違反醫療廣告規範，建議改寫。<div class="wp-check-text">' + safe.replace(re, '<mark>$1</mark>') + '</div>';
    };
    chk.addEventListener('input', run); run();
  }
}

    return banner('doctors', '醫師團隊', '由整形外科與皮膚科專科醫師親自評估、執行與追蹤。', [[null, '醫師團隊']]) + `
    <section class="sec tight"><div class="wrap doc-list">${DOCTORS.map(d => `
      <article class="doc" id="doc-${d.id}" data-rv>${pic(d.photo, d.name + '醫師', 'arch', '', '人物示意')}<div class="doc-b">
        ${eyebrow(d.spec)}<h2>${d.name}<small>${d.title}</small></h2><p class="bio">${d.bio}</p>
        <h3>專長</h3><ul class="chips">${d.skills.map(s => `<li>${s}</li>`).join('')}</ul>
        <details class="acc sm" open><summary><h3>學經歷與證書</h3></summary><ul class="dots">${d.edu.map(s => `<li>${s}</li>`).join('')}</ul><p class="cert">${d.certs.join('、')}｜${d.cert}</p></details>
        <p class="hint">人物與照片皆為示意</p></div></article>`).join('')}</div></section>`;
  },

  articles() {
    return banner('articles', '最新消息', '門診時間異動、醫師門診調整與就醫須知。', [[null, '最新消息']]) + `
    <section class="sec tight"><div class="wrap layout"><div class="main"><div class="list">${ARTICLES.map(a => `
      <a class="card row-card" href="#a-${a.id}">${pic(a.photo, a.title)}<div class="card-b"><div class="meta"><span class="tag">${a.tag}</span><time>${fmtDate(a.date)}</time></div><h2>${a.title}</h2><p>${a.excerpt}</p><span class="more">閱讀全文 ${ARROW}</span></div></a>`).join('')}</div></div>
      <aside class="side"><div class="side-card"><h3>消息分類</h3><ul class="links">${['門診公告', '醫師門診', '就醫須知'].map(c => `<li><span>${c}</span><small>${ARTICLES.filter(a => a.tag === c).length}</small></li>`).join('')}</ul></div>${ctaCard()}</aside></div></section>`;
  },

  article(a) {
    const d = a.doctor ? dById(a.doctor) : null;
    return banner('articles', a.title, '', [['articles', '最新消息'], [null, a.tag]]) + `
    <section class="sec tight"><div class="wrap layout"><article class="main prose">
      <div class="meta"><span class="tag">${a.tag}</span><time>${fmtDate(a.date)}</time><span>發布｜${byName(a)}</span></div>
      <p class="lead">${a.excerpt}</p>
      ${pic(a.photo, a.title, 'r169')}
      ${a.body.map(([h, ps]) => `<h2>${h}</h2>${ps.map(p => `<p>${p}</p>`).join('')}`).join('')}
      <div class="notice"><p>${NOTE_ARTICLE}</p></div>
    </article><aside class="side">
      ${d ? `<div class="side-card"><h3>相關醫師</h3><a class="doc-mini" href="#doctors">${pic(d.photo, d.name, 'avatar', '', '')}<span><b>${d.name} ${d.title}</b><small>${d.spec}</small></span></a></div>` : ''}
      ${a.treatments.some(id => S.pub[id]) ? `<div class="side-card"><h3>相關療程</h3><ul class="links">${a.treatments.filter(id => S.pub[id]).map(id => `<li>${L('t-' + id, tById(id).name + ARROW)}</li>`).join('')}</ul></div>` : ''}
      ${ctaCard()}</aside></div></section>`;
  },

  about() {
    return banner('about', '關於診所', CLINIC.sub, [[null, '關於診所']]) + `
    <section class="sec"><div class="wrap">${ABOUT.values.map(([h, p], i) => `<div class="split ${i % 2 ? 'rev' : ''}" data-rv>${pic(ABOUT_IMGS[i], h, i % 2 ? 'r43' : 'arch')}<div>${eyebrow('0' + (i + 1))}<h2>${h}</h2><p>${p}</p></div></div>`).join('')}</div></section>
    <section class="sec alt" data-rv><div class="wrap"><div class="sec-h center">${eyebrow('Facilities')}<h2>設備與環境</h2><p>${ABOUT.permit}</p></div>
      <div class="grid4">${ABOUT.facilities.map(([h, p, s, k]) => `<div class="fac">${pic(k, h, 'r34')}<h3>${h}</h3><p>${p}</p></div>`).join('')}</div></div></section>
    <section class="sec" data-rv><div class="wrap"><div class="sec-h center">${eyebrow('Process')}<h2>諮詢流程</h2></div><ol class="steps">${FLOW.map(([h, p], i) => `<li><span class="n">${String(i + 1).padStart(2, '0')}</span><h3>${h}</h3><p>${p}</p></li>`).join('')}</ol></div></section>
    <section class="sec alt" data-rv><div class="wrap grid2"><div class="icard"><h3>診所資訊</h3><ul class="info dark"><li>${CLINIC.address}</li><li>電話 ${CLINIC.phone}</li><li>負責醫師 ${CLINIC.director}</li><li>診療科別 ${CLINIC.depts}</li><li>開業執照 ${CLINIC.license}</li></ul></div><div class="icard"><h3>門診時間</h3>${hoursList()}</div></div></section>`;
  },

  contact() {
    return banner('contact', '預約諮詢', '送出表單後，診所人員將於門診時間內以電話與你確認時段。療程是否適合，需由醫師當面評估。', [[null, '預約諮詢']]) + `
    <section class="sec alt tight"><div class="wrap layout">
      <form class="main form" data-demo-form novalidate>
        <h2>線上預約表單</h2>
        <div class="f2"><label>姓名 <b>必填</b><input id="f-name" required autocomplete="name"></label><label>聯絡電話 <b>必填</b><input id="f-tel" type="tel" required autocomplete="tel"></label></div>
        <label>Email<input id="f-mail" type="email" autocomplete="email"></label>
        <div class="f2"><label>想諮詢的項目<select id="f-item">${Object.entries(CATS).map(([k, v]) => `<optgroup label="${v}">${TREATMENTS.filter(t => t.cat === k).map(t => `<option>${t.name}</option>`).join('')}</optgroup>`).join('')}<option>尚未確定，想先諮詢</option></select></label>
        <fieldset><legend>希望時段</legend><div class="radios">${['平日午後', '平日晚間', '週六'].map((x, i) => `<label class="r"><input type="radio" name="slot" id="f-slot${i}" ${i ? '' : 'checked'}>${x}</label>`).join('')}</div></fieldset></div>
        <label>想詢問的事項<textarea id="f-msg" rows="4"></textarea></label>
        <label class="chk"><input type="checkbox" id="f-agree" required>我了解此表單僅為預約諮詢，療程是否適合需由醫師當面評估</label>
        <button class="btn" type="submit">送出預約</button>
        <p role="status" class="formstatus" hidden></p>
      </form>
      <aside class="side"><div class="side-card"><h3>診所資訊</h3><ul class="info dark"><li>${CLINIC.address}</li><li>電話 ${CLINIC.phone}</li></ul><h3>門診時間</h3>${hoursList()}<h3>交通方式</h3><ul class="dots">${CLINIC.transit.map(x => `<li>${x}</li>`).join('')}</ul></div></aside>
    </div><div class="wrap"><figure class="map">${mapSVG()}<figcaption>地圖示意｜正式網站嵌入地圖服務</figcaption></figure></div></section>`;
  },

  backend({ toast, screens }) {
    return banner('backend', '診所人員可以自己做的事', '正式網站採用 WordPress。以下為後台畫面示意：日常更新都是填表單與按按鈕，不需要程式背景。', [[null, '後台操作說明']]) + `
    <section class="sec tight"><div class="wrap">${toast}
      <nav class="toc" aria-label="本頁內容">${screens.map(([h], i) => `<button type="button" data-jump="bk${i}">${h}</button>`).join('')}</nav>
      ${screens.map(([h, p, frame, pts, demo], i) => `<section class="bk" id="bk${i}"><div class="bk-t"><span class="n">${String(i + 1).padStart(2, '0')}</span><div><h2>${h}</h2><p>${p}</p><ul class="checks plain">${pts.map(x => `<li>${x}</li>`).join('')}</ul>${demo ? `<p class="demo-note">${demo}</p>` : ''}</div></div>${frame}</section>`).join('')}
      <section class="handover"><h2>交付與維護</h2><ul class="checks plain">${HANDOVER.map(x => `<li>${x}</li>`).join('')}</ul></section>
    </div></section>`;
  },

  after(r, app, first) {
    app.querySelectorAll('[data-jump]').forEach(b => b.addEventListener('click', () => document.getElementById(b.dataset.jump).scrollIntoView({ behavior: RMa() ? 'auto' : 'smooth' })));
    app.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => {
      tab = b.dataset.tab;
      app.querySelectorAll('[data-tab]').forEach(x => x.setAttribute('aria-selected', String(x === b)));
      app.querySelectorAll('[data-panel]').forEach(p => { p.hidden = p.dataset.panel !== tab; if (!p.hidden && !RMa()) p.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 220 }); });
    }));
    if (r.view === 'treatments' && sessionCat) { const b = app.querySelector(`[data-filter="${sessionCat}"]`); sessionCat = null; if (b) b.click(); }
    if (RMa()) return;
    if ('IntersectionObserver' in window) {
      const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.remove('rv-pre'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -8% 0px' });
      app.querySelectorAll('[data-rv]').forEach(el => { if (el.getBoundingClientRect().top > innerHeight * 0.92) { el.classList.add('rv-pre'); io.observe(el); } });
    }
    app.querySelectorAll('[data-count]').forEach(el => {
      const n = +el.dataset.count, t0 = performance.now();
      const step = t => { const p = Math.min(1, (t - t0) / 900); el.textContent = Math.round(n * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); };
      requestAnimationFrame(step);
    });
  }
};
let sessionCat = null;
</script>
</body></html>
