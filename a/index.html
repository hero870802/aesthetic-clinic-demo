<style>/* Shared: WordPress admin mock (fixed WP look in both versions) */
.wp-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 12px 32px -12px rgba(20,30,40,.25)}
.wp{min-width:760px;font-family:-apple-system,"Segoe UI","Noto Sans TC",sans-serif;font-size:13px;color:#1d2327;background:#f0f0f1;line-height:1.5;text-align:left}
.wp-bar{display:flex;gap:12px;align-items:center;background:#1d2327;color:#f0f0f1;height:32px;padding:0 12px;font-size:12px}
.wp-logo{width:20px;height:20px;border-radius:50%;border:1.5px solid #c3c4c7;display:grid;place-items:center;font-weight:700;font-size:11px;font-family:Georgia,serif}
.wp-bar-r{margin-left:auto;opacity:.8}
.wp-body{display:flex}
.wp-menu{width:132px;flex:none;background:#1d2327;padding:8px 0;display:flex;flex-direction:column}
.wp-menu span{color:#c3c4c7;padding:7px 14px;font-size:12.5px}
.wp-menu span.on{background:#2271b1;color:#fff}
.wp-main{flex:1;min-width:0;padding:16px 20px 22px}
.wp-h{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:400;margin-bottom:14px}
.wp-card,.wp-box{background:#fff;border:1px solid #c3c4c7;padding:14px;margin-bottom:12px}
.wp-box{padding:10px 12px}
.wp-label{font-weight:600;margin:10px 0 5px;display:flex;align-items:center;gap:6px}
.wp-label:first-child{margin-top:0}
.wp-label.sm{font-size:12px;margin-top:10px}
.wp-label em{font-style:normal;font-weight:400;color:#646970;font-size:12px}
.wp-label .req{font-weight:500;font-size:11px;color:#b32d2e;background:#fcf0f1;padding:0 6px;border-radius:2px}
.wp-input{display:block;width:100%;box-sizing:border-box;border:1px solid #8c8f94;border-radius:4px;background:#fff;padding:6px 8px;min-height:32px;font:inherit;color:#2c3338;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wp-input.lg{font-size:18px;padding:8px 10px}
.wp-input.tall{white-space:normal;min-height:58px}
.wp-input.doc{min-height:96px;border-top-left-radius:0;border-top-right-radius:0}
.wp-input.rep{display:flex;justify-content:space-between;margin-bottom:4px}
.wp-input.rep span{color:#b32d2e}
.wp-input.live{outline:2px solid #2271b1;outline-offset:1px}
.wp-input.locked{background:#f6f7f7;color:#50575e;display:flex;gap:6px;align-items:center}
.wp-btn{display:inline-block;background:#2271b1;color:#fff;border:1px solid #2271b1;border-radius:3px;padding:4px 10px;font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap}
.wp-btn.ghost{background:#f6f7f7;color:#2271b1;font-size:12px}
button.wp-btn:hover{background:#135e96}
button.wp-btn:focus-visible,.wp-link.btn:focus-visible,.wp-pick:focus-visible,.wp-input.live:focus-visible{outline:2px solid #f0b849;outline-offset:2px}
.wp-hint{color:#646970;font-size:12px;display:flex;align-items:center;gap:6px}
.wp-hint.sep{border-top:1px dashed #c3c4c7;padding-top:10px;margin-top:14px}
.wp-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0}
.wp-row.end{justify-content:flex-end}.wp-row.between{justify-content:space-between}
.wp-link{color:#2271b1;font-size:12px;cursor:default}
.wp-link.btn{background:none;border:0;padding:0;font:inherit;font-size:12px;color:#2271b1;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.wp-link.danger{color:#b32d2e}
.wp-imgfield{display:flex;gap:14px;align-items:flex-start}
.wp-imgmeta{flex:1;min-width:0}
.wp-thumb{width:220px;aspect-ratio:16/9;border:1px solid #dcdcde;overflow:hidden;background:#f6f7f7;flex:none}
.wp-thumb.sm{width:100%}.wp-thumb.xs{width:96px}
.wp-thumb.sel{outline:3px solid #2271b1;outline-offset:-3px}
.wp-thumb>*{width:100%;height:100%;display:block}
.wp-banners{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.wp-banners>div{display:flex;flex-direction:column;gap:3px;font-size:12px}
.wp-picker{border-top:1px solid #dcdcde;margin-top:12px;padding-top:4px}
.wp-pickgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.wp-pick{border:1px solid #c3c4c7;background:#fff;padding:4px;cursor:pointer;display:flex;flex-direction:column;gap:4px;font:inherit;font-size:11px;color:#50575e;text-align:left}
.wp-pick>:first-child{aspect-ratio:16/9;width:100%;overflow:hidden}
.wp-pick.sel{outline:3px solid #2271b1;outline-offset:-1px}
.wp-pick:hover{border-color:#2271b1}
.wp-drop{border:2px dashed #c3c4c7;background:#fff;padding:18px;display:flex;gap:8px;justify-content:center;align-items:center;color:#50575e;margin-bottom:12px}
.wp-media{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.wp-media .wp-thumb{width:100%;aspect-ratio:1}
.wp-table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #c3c4c7;margin-top:8px}
.wp-table th{text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid #c3c4c7}
.wp-table td{padding:8px 10px;border-bottom:1px solid #f0f0f1;vertical-align:top}
.wp-table tr:nth-child(even) td{background:#f6f7f7}
.wp-table tr.draft strong{color:#8c8f94}
.wp-table td.num{font-variant-numeric:tabular-nums;color:#50575e}
.wp-rowact{display:flex;gap:10px;margin-top:2px;flex-wrap:wrap}
.wp-status{font-size:11.5px;padding:1px 8px;border-radius:10px}
.wp-status.pub{background:#edfaef;color:#00701a}.wp-status.dr{background:#fcf9e8;color:#8a6100}
.wp-edit{display:flex;gap:16px;align-items:flex-start}
.wp-edit.mt{margin-top:16px}
.wp-fields{flex:1;min-width:0;background:#fff;border:1px solid #c3c4c7;padding:14px}
.wp-side{width:200px;flex:none}
.wp-grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wp-grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.wp-notice{background:#fcf9e8;border-left:4px solid #dba617;padding:8px 12px;margin-bottom:12px}
.wp-toast{background:#edfaef;border-left:4px solid #00a32a;padding:10px 14px;margin:0 0 16px;font-size:14px;color:#1d2327}
.wp-check{font-size:12px;margin:6px 0 4px;padding:6px 10px;border-radius:3px}
.wp-check.ok{background:#edfaef;color:#00701a}
.wp-check.warn{background:#fcf0f1;color:#8a2424}
.wp-check-text{margin-top:4px;color:#1d2327}
.wp-check mark{background:#f5c0c0;color:#8a2424;padding:0 2px}
.wp-cb{display:inline-block;width:12px;height:12px;border:1px solid #8c8f94;border-radius:2px;background:#fff}
.wp-cb.on{background:#2271b1;border-color:#2271b1;box-shadow:inset 0 0 0 2px #fff}
.wp-toolbar{display:flex;gap:12px;align-items:center;border:1px solid #8c8f94;border-bottom:0;padding:5px 10px;margin-top:10px;background:#f6f7f7;border-radius:4px 4px 0 0;font-size:12px;color:#3c434a}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* A: standard premium clinic theme — boxed 1140 grid, header + banner + main/sidebar, cards */
:root{
  --bg:#FFFFFF; --surface:#F2F5F7; --ink:#1F2D3A; --muted:#5A6B78; --primary:#3F6E82; --primary-d:#2F5466; --accent:#C9A49A; --line:#DCE3E7; --warn-bg:#FBF3F0;
  --f-sans:"Manrope","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased}
a{color:var(--primary)}
h1,h2,h3,h4{line-height:1.35;text-wrap:balance;margin:0;font-weight:700;letter-spacing:.01em}
p{margin:0}
.wrap{max-width:1140px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
.demobar{background:var(--ink);color:#E6ECEF;font-size:13px;padding-block:8px}
.demobar .wrap:first-child{display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:space-between}
.demobar a{color:#fff;font-weight:600}
.demobar .fic{opacity:.7;font-size:12px;margin-top:2px}
.topbar{background:var(--surface);font-size:13px;color:var(--muted)}
.topbar .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:6px}
.topbar span{display:inline-flex;gap:6px;align-items:center}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:72px}
.logo{display:flex;flex-direction:column;text-decoration:none;color:var(--ink);line-height:1.2}
.logo-zh{font-size:21px;font-weight:700;letter-spacing:.12em}
.logo-en{font-size:10.5px;letter-spacing:.32em;color:var(--primary);font-weight:600}
.logo.light{color:#fff}.logo.light .logo-en{color:var(--accent)}
.nav{display:flex;align-items:center;gap:4px}
.nav a{color:var(--ink);text-decoration:none;padding:8px 12px;font-size:15px;border-radius:6px}
.nav a:not(.btn):hover,.nav a.is-current:not(.btn){color:var(--primary)}
.nav a.is-current:not(.btn){box-shadow:inset 0 -2px 0 var(--accent);border-radius:0}
.burger{display:none;background:none;border:0;width:44px;height:44px;padding:10px;cursor:pointer;flex-direction:column;justify-content:space-between}
.burger span:not(.sr-only){display:block;height:2px;background:var(--ink);border-radius:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--primary);color:#fff;text-decoration:none;border:1px solid var(--primary);padding:11px 22px;border-radius:8px;font:inherit;font-weight:600;font-size:15px;cursor:pointer;transition:background .15s}
.btn:hover{background:var(--primary-d);border-color:var(--primary-d)}
.btn.sm{padding:8px 16px;font-size:14px;color:#fff!important;margin-left:8px}
.btn.line{background:transparent;color:var(--primary)}
.btn.line:hover{background:var(--surface)}
.btn.light{background:#fff;color:var(--primary);border-color:#fff}
.row{display:flex;gap:12px;flex-wrap:wrap}
#app{transition:opacity .15s}#app.fade{opacity:0}
/* placeholders */
.ph{position:relative;background-color:var(--surface);background-image:repeating-linear-gradient(135deg,rgba(63,110,130,.07) 0 1px,transparent 1px 14px);aspect-ratio:16/10;border-radius:8px;display:flex;align-items:flex-end;overflow:hidden;max-width:100%}
.ph.v1{background-color:#EEF1F0;background-image:repeating-linear-gradient(45deg,rgba(63,110,130,.07) 0 1px,transparent 1px 14px)}
.ph.v2{background-color:#F4EFED;background-image:repeating-linear-gradient(135deg,rgba(201,164,154,.16) 0 1px,transparent 1px 14px)}
.ph.v3{background-color:#EDF1F5;background-image:repeating-linear-gradient(90deg,rgba(63,110,130,.06) 0 1px,transparent 1px 16px)}
.ph span{font-size:11.5px;color:var(--muted);background:rgba(255,255,255,.85);padding:3px 8px;margin:10px;border-radius:4px}
.ph.tall{aspect-ratio:4/3.4}.ph.portrait{aspect-ratio:4/4.4}.ph.avatar{width:56px;aspect-ratio:1;border-radius:50%;flex:none}.ph.avatar span{display:none}
.ph.mini{border-radius:0;aspect-ratio:auto;height:100%}
/* sections */
.sec{padding-block:72px}.sec.alt{background:var(--surface)}
.sec-h{margin-bottom:32px;display:flex;flex-direction:column;gap:8px}
.sec-h h2,.main h2,.split h2,.infoband h2,.handover h2{font-size:28px}
.sec-h p{color:var(--muted)}
.row-between{flex-direction:row;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px}
.eyebrow{color:var(--primary);font-weight:600;font-size:14px;letter-spacing:.08em}
.hero{background:linear-gradient(180deg,var(--surface),var(--bg));padding-block:56px 72px}
.hero-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:48px;align-items:center}
.hero-t{display:flex;flex-direction:column;gap:18px}
.hero h1{font-size:clamp(34px,5vw,52px);letter-spacing:.06em}
.hero-t>p:not(.eyebrow){color:var(--muted);max-width:30em}
.hero-i{position:relative}
.ph-cap{position:absolute;right:12px;top:12px;font-size:12px;background:var(--bg);padding:2px 10px;border-radius:20px;color:var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:8px;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;transition:border-color .15s}
a.card:hover{border-color:var(--primary)}
.card>.ph{border-radius:0}
.card-b{padding:20px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{font-size:19px}.card h3 small,.doc h2 small{font-size:14px;color:var(--muted);font-weight:500;margin-left:4px}
.card p{color:var(--muted);font-size:15px}
.card .en{font-size:13px;letter-spacing:.04em;color:var(--primary);margin-top:-4px}
.tag{align-self:flex-start;font-size:12px;font-weight:600;color:var(--primary);background:rgba(63,110,130,.08);padding:2px 10px;border-radius:20px}
.more{color:var(--primary);font-weight:600;font-size:14px;margin-top:auto;text-decoration:none}
.card.cat{padding:24px;gap:12px}
.card.cat ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.card.cat li a{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:500}
.card.cat li a:hover{color:var(--primary)}
.card.cat small{color:var(--muted);font-weight:400;font-size:12.5px;text-align:right}
.spec{color:var(--primary)!important;font-weight:600}
.meta{display:flex;gap:12px;align-items:center;font-size:13px;color:var(--muted);flex-wrap:wrap}
.meta time{font-variant-numeric:tabular-nums}
.byline{font-size:13px;color:var(--ink);margin-top:auto}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;counter-reset:s}
.steps.six{grid-template-columns:repeat(3,minmax(0,1fr))}
.steps li{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:22px;display:flex;flex-direction:column;gap:6px}
.sec.alt .steps li{border-color:transparent}
.steps .n{width:32px;height:32px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.steps h3{font-size:17px}.steps p{color:var(--muted);font-size:14.5px}
.center{text-align:center;margin-top:24px}
.infoband{background:var(--primary);color:#fff;padding-block:56px}
.infoband .hours dt,.infoband .hours dd{color:#fff}
.infoband p{margin-top:12px;opacity:.9}
.cta-box{background:rgba(255,255,255,.1);border-radius:8px;padding:28px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.hours{margin:12px 0 0;display:flex;flex-direction:column;gap:4px}
.hours div{display:flex;justify-content:space-between;gap:16px;border-bottom:1px dashed var(--line);padding-bottom:4px}
.infoband .hours div{border-color:rgba(255,255,255,.3)}
.hours dt{color:var(--muted)}.hours dd{margin:0;font-variant-numeric:tabular-nums}
/* banner + layout */
.banner{background:var(--surface);padding-block:40px 44px;border-bottom:1px solid var(--line)}
.banner h1{font-size:clamp(28px,4vw,38px);margin-top:8px;letter-spacing:.04em}
.banner p{color:var(--muted);margin-top:8px;max-width:42em}
.crumb{font-size:13px;color:var(--muted)}.crumb a{color:var(--muted);text-decoration:none}.crumb a:hover{color:var(--primary)}
.layout{display:grid;grid-template-columns:minmax(0,8fr) minmax(0,4fr);gap:48px;align-items:start}
.main{display:flex;flex-direction:column;gap:16px;min-width:0}
.main h2{font-size:23px;margin-top:20px}
.main>p,.prose p{max-width:65ch}
.lead{font-size:18px;color:var(--ink)}
.side{display:flex;flex-direction:column;gap:20px;position:sticky;top:96px}
.side-card{border:1px solid var(--line);border-radius:8px;padding:22px;display:flex;flex-direction:column;gap:10px}
.side-card h3{font-size:16px}.side-card h3:not(:first-child){margin-top:10px}
.side-card.cta{background:var(--surface);border-color:transparent}
.side-card .phone{font-size:14px;color:var(--muted)}
.links{list-style:none;margin:0;padding:0}
.links li{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 0;font-size:15px}
.links a{color:var(--ink);text-decoration:none}.links a:hover{color:var(--primary)}
.doc-mini{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--ink)}
.doc-mini span{display:flex;flex-direction:column}.doc-mini small{color:var(--muted)}
.checks,.dots{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.checks li,.dots li{padding-left:24px;position:relative}
.checks li::before{content:"";position:absolute;left:2px;top:.55em;width:10px;height:6px;border-left:2px solid var(--primary);border-bottom:2px solid var(--primary);transform:rotate(-45deg)}
.dots li::before{content:"";position:absolute;left:6px;top:.7em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.infogrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:0}
.infogrid div{background:var(--surface);border-radius:8px;padding:14px 16px}
.infogrid dt{font-size:13px;color:var(--primary);font-weight:700}.infogrid dd{margin:4px 0 0;font-size:15px}
.acc{border:1px solid var(--line);border-radius:8px;padding:4px 20px 18px}
.acc summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;padding-block:12px}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s;flex:none}
.acc[open] summary::after{transform:rotate(-135deg)}
.acc summary h2{margin:0;font-size:20px}
.acc.sm{padding:0 14px 12px}.acc.sm summary h3{font-size:15px}
.risks{margin:0;display:flex;flex-direction:column;gap:10px}
.risks div{display:grid;grid-template-columns:7em 1fr;gap:12px}
.risks dt{font-weight:700;font-size:14px;color:var(--ink)}.risks dd{margin:0}
.extra{background:var(--surface);padding:14px 18px;border-radius:8px}
.notice{background:var(--warn-bg);border:1px solid #EBD9D3;border-radius:8px;padding:16px 20px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.fee{margin-top:28px;font-size:14px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin-top:16px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}
.tabs button{font:inherit;font-size:15px;padding:8px 20px;border-radius:20px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff}
.list{display:flex;flex-direction:column;gap:20px}
.row-card{flex-direction:row}.row-card>.ph{width:38%;flex:none;aspect-ratio:auto}
.row-card h2{font-size:20px;margin:0}
.doc .card-b{gap:10px}.doc h2{font-size:22px}.doc h3{font-size:15px;margin-top:6px}
.cert{font-size:13px;color:var(--muted);margin-top:8px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;margin-bottom:48px}
.split.rev>.ph{order:2}

function parseRoute() {
  const h = (location.hash || '#home').slice(1);
  if (ROUTES.includes(h)) return { view: h };
  if (h.startsWith('t-') && tById(h.slice(2))) return { view: 'treatment', item: tById(h.slice(2)) };
  if (h.startsWith('a-') && aById(h.slice(2))) return { view: 'article', item: aById(h.slice(2)) };
  return { view: 'home' };
}

function pageTitle(r) {
  const base = r.item ? (r.item.name || r.item.title) : PAGE_NAMES[r.view];
  return (r.view === 'home' ? CLINIC.name + '｜' + CLINIC.tagline : base + '｜' + CLINIC.name) + '（示意）';
}

function renderView(r) {
  if (r.view === 'treatment' && !S.pub[r.item.id]) return V.unpublished(r.item);
  if (r.view === 'treatment') return V.treatment(r.item);
  if (r.view === 'article') return V.article(r.item);
  if (r.view === 'backend') return V.backend(backendHTML());
  return V[r.view]();
}

let firstRender = true;
function route(opts = {}) {
  const r = parseRoute();
  const app = document.getElementById('app');
  const paint = () => {
    app.innerHTML = renderView(r);
    document.title = pageTitle(r);
    if (!opts.keepScroll) window.scrollTo(0, 0);
    document.querySelectorAll('[data-nav]').forEach(a => {
      const cur = a.dataset.nav === r.view || (r.view === 'treatment' && a.dataset.nav === 'treatments') || (r.view === 'article' && a.dataset.nav === 'articles');
      a.classList.toggle('is-current', cur);
      if (cur) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    bindCommon(app);
    V.after && V.after(r, app, firstRender);
    if (!firstRender && !opts.keepScroll) { const h1 = app.querySelector('h1'); if (h1) { h1.setAttribute('tabindex', '-1'); h1.focus({ preventScroll: true }); } }
    firstRender = false;
  };
  if (!firstRender && !opts.keepScroll && V.transition) V.transition(paint); else paint();
}

function bindCommon(root) {
  root.querySelectorAll('form[data-demo-form]').forEach(f => f.addEventListener('submit', e => {
    e.preventDefault();
    const st = f.querySelector('[role="status"]');
    if (!f.checkValidity()) { f.reportValidity(); return; }
    st.textContent = '此為示範網站，資料並未送出。正式網站將寄送至診所信箱並寫入後台「聯絡表單紀錄」。';
    st.hidden = false;
  }));
  root.querySelectorAll('[data-filter]').forEach(btn => btn.addEventListener('click', () => {
    const c = btn.dataset.filter;
    root.querySelectorAll('[data-filter]').forEach(b => b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'));
    root.querySelectorAll('[data-cat]').forEach(el => { el.hidden = !(c === 'all' || el.dataset.cat === c); });
  }));
  // backend interactions
  root.querySelectorAll('[data-toggle-pub]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.togglePub; S.pub[id] = !S.pub[id];
    S.toast = S.pub[id] ? `「${tById(id).name}」已重新發布，前台療程列表與首頁已恢復顯示。` : `「${tById(id).name}」已轉為草稿（下架）。到前台療程列表看看，它已經不見了；內容仍保留在後台。`;
    route({ keepScroll: true });
  }));
  root.querySelectorAll('[data-open-picker]').forEach(b => b.addEventListener('click', () => { S.picker = !S.picker; route({ keepScroll: true }); }));
  root.querySelectorAll('[data-pick]').forEach(b => b.addEventListener('click', () => {
    S.hero = +b.dataset.pick; S.picker = false; S.toast = '首頁主視覺已更換。回到首頁就能看到新的圖片。'; route({ keepScroll: true });
  }));
  const chk = root.querySelector('#wp-summary');
  if (chk) {
    const out = root.querySelector('#wp-summary-check');
    const run = () => {
      const v = chk.value; const hits = BANNED.filter(w => v.includes(w));
      const count = root.querySelector('#wp-summary-count'); count.textContent = `${[...v].length} / 40 字`;
      if (!hits.length) { out.className = 'wp-check ok'; out.textContent = '用詞檢查通過，可以發布。'; return; }
      const re = new RegExp('(' + hits.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'g');
      const safe = v.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
      out.className = 'wp-check warn';
      out.innerHTML = '<strong>發布前提醒：</strong>以下標示的詞語可能違反醫療廣告規範，建議改寫。<div class="wp-check-text">' + safe.replace(re, '<mark>$1</mark>') + '</div>';
    };
    chk.addEventListener('input', run); run();
  }
}

    </div></section>
    <section class="sec"><div class="wrap"><div class="sec-h"><h2>療程項目</h2><p>依治療方式分為三大類，點選了解原理、適應症與風險。</p></div>
      <div class="grid3">${groups.map(g => `<div class="card cat"><span class="tag">${g.v}</span><h3>${g.v}療程</h3><ul>${g.items.map(t => `<li>${L('t-' + t.id, t.name + ' <small>' + t.en + '</small>')}</li>`).join('')}</ul>${L('treatments', '查看全部 →', 'more')}</div>`).join('')}</div></div></section>
    <section class="sec alt"><div class="wrap"><div class="sec-h"><h2>諮詢流程</h2><p>從預約到回診，每一步都有醫師參與。</p></div>
      <ol class="steps">${FLOW.slice(0, 4).map(([h, p], i) => `<li><span class="n">${i + 1}</span><h3>${h}</h3><p>${p}</p></li>`).join('')}</ol><p class="center">${L('about', '完整流程與診所介紹 →', 'more')}</p></div></section>
    <section class="sec"><div class="wrap"><div class="sec-h"><h2>醫師團隊</h2><p>由整形外科與皮膚科專科醫師親自評估與執行。</p></div>
      <div class="grid3">${DOCTORS.map(d => `<a class="card dcard" href="#doctors">${ph(d.seed, d.name + '醫師照片', 'portrait')}<div class="card-b"><h3>${d.name} <small>${d.title}</small></h3><p class="spec">${d.spec}</p><p>${d.skills.join('、')}</p></div></a>`).join('')}</div></div></section>
    <section class="sec alt"><div class="wrap"><div class="sec-h row-between"><div><h2>衛教文章</h2><p>由本院醫師撰寫的治療知識與照護說明。</p></div>${L('articles', '所有文章 →', 'more')}</div>
      <div class="grid3">${ARTICLES.slice(0, 3).map(aCard).join('')}</div></div></section>
    <section class="infoband"><div class="wrap grid2">
      <div><h2>門診資訊</h2>${hoursList()}<p>${CLINIC.address}<br>電話 ${CLINIC.phone}</p></div>
      <div class="cta-box"><h2>預約諮詢</h2><p>送出表單後，診所人員將於門診時間內以電話與你確認時段。</p>${L('contact', '前往預約', 'btn light')}</div>
    </div></section>`;
  },

  treatments() {
    return banner('療程項目', '以下為本院提供的醫學美容療程。療程是否適合需經醫師評估。', [[null, '療程項目']]) + `
    <section class="sec"><div class="wrap">
      <div class="tabs" role="group" aria-label="療程分類"><button type="button" data-filter="all" aria-pressed="true">全部</button>${Object.entries(CATS).map(([k, v]) => `<button type="button" data-filter="${k}" aria-pressed="false">${v}</button>`).join('')}</div>
      <div class="grid3">${pubT().map(tCard).join('')}</div>
      ${pubT().length < TREATMENTS.length ? `<p class="hint">有 ${TREATMENTS.length - pubT().length} 個療程目前在後台設為草稿，因此未顯示。${L('backend', '回到後台示意')}</p>` : ''}
      <p class="fee">${NOTE_FEE}</p></div></section>`;
  },

  treatment(t) {
    const d = dById(t.doctor);
    const others = pubT().filter(x => x.id !== t.id);
    return banner(t.name, t.en + '｜' + CATS[t.cat] + '療程', [['treatments', '療程項目'], [null, t.name]]) + `
    <section class="sec"><div class="wrap layout">
      <article class="main">
        <p class="lead">${t.summary}</p>
        ${ph(t.seed, t.name + '療程情境')}
        <h2>療程原理</h2>${t.principle.map(p => `<p>${p}</p>`).join('')}
        <h2>適應症</h2><ul class="checks">${t.indications.map(i => `<li>${i}</li>`).join('')}</ul>
        <h2>療程資訊</h2><dl class="infogrid">${t.info.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>
        <details open class="acc"><summary><h2>可能的副作用與風險</h2></summary><dl class="risks">${t.risks.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl></details>
        <details open class="acc"><summary><h2>不適合對象</h2></summary><ul class="dots">${t.contra.map(i => `<li>${i}</li>`).join('')}</ul></details>
        <details open class="acc"><summary><h2>術後照護</h2></summary><ul class="dots">${t.care.map(i => `<li>${i}</li>`).join('')}</ul></details>
        ${t.extra ? `<p class="extra">${t.extra}</p>` : ''}
        <div class="notice"><p><strong>${NOTE_EFFECT}</strong></p><p>${NOTE_FEE}</p></div>
        ${t.articles.length ? `<h2>相關衛教文章</h2><div class="grid2">${t.articles.map(id => aCard(aById(id))).join('')}</div>` : ''}
      </article>
      <aside class="side">
        ${ctaCard()}
        <div class="side-card"><h3>主治醫師</h3><a class="doc-mini" href="#doctors">${ph(d.seed, d.name, 'avatar')}<span><b>${d.name} ${d.title}</b><small>${d.spec}</small></span></a></div>
        <div class="side-card"><h3>其他療程</h3><ul class="links">${others.map(x => `<li>${L('t-' + x.id, x.name)}</li>`).join('')}</ul></div>
        <div class="side-card"><h3>門診時間</h3>${hoursList()}</div>
      </aside></div></section>`;
  },

  unpublished(t) {
    return banner(t.name, '此療程目前未公開', [['treatments', '療程項目'], [null, t.name]]) + `<section class="sec"><div class="wrap narrow"><p>這個療程已在後台轉為草稿，前台暫不顯示。重新發布後就會回到療程列表。</p><p>${L('backend', '回到後台示意', 'btn')}</p></div></section>`;
  },

  doctors() {
    return banner('醫師團隊', '由整形外科與皮膚科專科醫師親自評估、執行與追蹤。', [[null, '醫師團隊']]) + `
    <section class="sec"><div class="wrap"><div class="grid3">${DOCTORS.map(d => `
      <article class="card doc">${ph(d.seed, d.name + '醫師照片', 'portrait')}<div class="card-b">
        <h2>${d.name} <small>${d.title}</small></h2><p class="spec">${d.spec}</p><p>${d.bio}</p>
        <h3>專長</h3><ul class="dots">${d.skills.map(s => `<li>${s}</li>`).join('')}</ul>
        <details class="acc sm"><summary><h3>學經歷與證書</h3></summary><ul class="dots">${d.edu.map(s => `<li>${s}</li>`).join('')}</ul><p class="cert">${d.certs.join('、')}<br>${d.cert}</p></details>
        <p class="hint">人物為示意</p></div></article>`).join('')}</div></div></section>`;
  },

  articles() {
    return banner('衛教文章', '由本院醫師撰寫，說明治療原理、風險與照護方式。', [[null, '衛教文章']]) + `
    <section class="sec"><div class="wrap layout"><div class="main"><div class="list">${ARTICLES.map(a => `
      <a class="card row-card" href="#a-${a.id}">${ph(a.seed, a.title)}<div class="card-b"><div class="meta"><span class="tag">${a.tag}</span><time>${fmtDate(a.date)}</time></div><h2>${a.title}</h2><p>${a.excerpt}</p><span class="byline">${dById(a.author).name} 醫師</span></div></a>`).join('')}</div></div>
      <aside class="side"><div class="side-card"><h3>文章分類</h3><ul class="links">${Object.values(CATS).map(c => `<li><span>${c}</span><small>${ARTICLES.filter(a => a.tag === c).length}</small></li>`).join('')}</ul></div>
      <div class="side-card"><h3>相關療程</h3><ul class="links">${pubT().map(x => `<li>${L('t-' + x.id, x.name)}</li>`).join('')}</ul></div></aside></div></section>`;
  },

  article(a) {
    const d = dById(a.author);
    return banner(a.title, '', [['articles', '衛教文章'], [null, a.tag]]) + `
    <section class="sec"><div class="wrap layout"><article class="main prose">
      <div class="meta"><span class="tag">${a.tag}</span><time>${fmtDate(a.date)}</time><a href="#doctors">撰文｜${d.name} 醫師</a></div>
      <p class="lead">${a.excerpt}</p>
      ${a.body.map(([h, ps]) => `<h2>${h}</h2>${ps.map(p => `<p>${p}</p>`).join('')}`).join('')}
      <div class="notice"><p>${NOTE_ARTICLE}</p></div>
    </article><aside class="side">
      <div class="side-card"><h3>撰文醫師</h3><a class="doc-mini" href="#doctors">${ph(d.seed, d.name, 'avatar')}<span><b>${d.name} ${d.title}</b><small>${d.spec}</small></span></a></div>
      <div class="side-card"><h3>相關療程</h3><ul class="links">${a.treatments.filter(id => S.pub[id]).map(id => `<li>${L('t-' + id, tById(id).name)}</li>`).join('')}</ul></div>
      ${ctaCard()}</aside></div></section>`;
  },

  about() {
    return banner('關於診所', CLINIC.sub, [[null, '關於診所']]) + `
    <section class="sec"><div class="wrap">${ABOUT.values.map(([h, p], i) => `<div class="split ${i % 2 ? 'rev' : ''}">${ph(i + 4, h)}<div><h2>${h}</h2><p>${p}</p></div></div>`).join('')}</div></section>
    <section class="sec alt"><div class="wrap"><div class="sec-h"><h2>設備與環境</h2><p>${ABOUT.permit}</p></div>
      <div class="grid4">${ABOUT.facilities.map(([h, p, s]) => `<div class="card">${ph(s, h)}<div class="card-b"><h3>${h}</h3><p>${p}</p></div></div>`).join('')}</div></div></section>
    <section class="sec"><div class="wrap"><div class="sec-h"><h2>諮詢流程</h2></div><ol class="steps six">${FLOW.map(([h, p], i) => `<li><span class="n">${i + 1}</span><h3>${h}</h3><p>${p}</p></li>`).join('')}</ol></div></section>
    <section class="sec alt"><div class="wrap grid2"><div><h2>診所資訊</h2><ul class="info dark"><li>${CLINIC.address}</li><li>電話 ${CLINIC.phone}</li><li>負責醫師 ${CLINIC.director}</li><li>診療科別 ${CLINIC.depts}</li><li>開業執照 ${CLINIC.license}</li></ul></div><div><h2>門診時間</h2>${hoursList()}</div></div></section>`;
  },

  contact() {
    return banner('預約諮詢', '送出表單後，診所人員將於門診時間內以電話與你確認時段。療程是否適合，需由醫師當面評估。', [[null, '預約諮詢']]) + `
    <section class="sec"><div class="wrap layout">
      <form class="main form" data-demo-form novalidate>
        <div class="f2"><label>姓名 <b>必填</b><input id="f-name" required autocomplete="name"></label><label>聯絡電話 <b>必填</b><input id="f-tel" type="tel" required autocomplete="tel"></label></div>
        <label>Email<input id="f-mail" type="email" autocomplete="email"></label>
        <div class="f2"><label>想諮詢的項目<select id="f-item">${TREATMENTS.map(t => `<option>${t.name}</option>`).join('')}<option>尚未確定，想先諮詢</option></select></label>
        <fieldset><legend>希望時段</legend><div class="radios">${['平日午後', '平日晚間', '週六'].map((x, i) => `<label class="r"><input type="radio" name="slot" id="f-slot${i}" ${i ? '' : 'checked'}>${x}</label>`).join('')}</div></fieldset></div>
        <label>想詢問的事項<textarea id="f-msg" rows="4"></textarea></label>
        <label class="chk"><input type="checkbox" id="f-agree" required>我了解此表單僅為預約諮詢，療程是否適合需由醫師當面評估</label>
        <button class="btn" type="submit">送出預約</button>
        <p role="status" class="formstatus" hidden></p>
      </form>
      <aside class="side"><div class="side-card"><h3>診所資訊</h3><ul class="info dark"><li>${CLINIC.address}</li><li>電話 ${CLINIC.phone}</li></ul><h3>門診時間</h3>${hoursList()}<h3>交通方式</h3><ul class="dots">${CLINIC.transit.map(x => `<li>${x}</li>`).join('')}</ul></div></aside>
    </div><div class="wrap"><figure class="map">${mapSVG()}<figcaption>地圖示意｜正式網站嵌入地圖服務</figcaption></figure></div></section>`;
  },

  backend({ toast, screens }) {
    return banner('診所人員可以自己做的事', '正式網站採用 WordPress。以下為後台畫面示意：日常更新都是填表單與按按鈕，不需要程式背景。', [[null, '後台操作說明']]) + `
    <section class="sec"><div class="wrap">${toast}
      <nav class="toc" aria-label="本頁內容">${screens.map(([h], i) => `<button type="button" data-jump="bk${i}">${h}</button>`).join('')}</nav>
      ${screens.map(([h, p, frame, pts, demo], i) => `<section class="bk" id="bk${i}"><div class="bk-t"><span class="n">${i + 1}</span><div><h2>${h}</h2><p>${p}</p><ul class="checks">${pts.map(x => `<li>${x}</li>`).join('')}</ul>${demo ? `<p class="demo-note">${demo}</p>` : ''}</div></div>${frame}</section>`).join('')}
      <section class="handover"><h2>交付與維護</h2><ul class="checks">${HANDOVER.map(x => `<li>${x}</li>`).join('')}</ul></section>
    </div></section>`;
  },

  after(r, app) {
    app.querySelectorAll('[data-jump]').forEach(b => b.addEventListener('click', () => document.getElementById(b.dataset.jump).scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' })));
  }
};
</script>
</body></html>
