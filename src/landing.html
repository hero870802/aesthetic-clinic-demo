<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>醫美診所官網 Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@500&display=swap">
<style>
:root{--bg:#F4F5F3;--ink:#1F2A28;--muted:#5C6865;--line:#D5DAD6;--a:#3F6E82;--b:#A27F3F}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",sans-serif;line-height:1.8}
main{max-width:980px;margin:0 auto;padding:72px max(16px,env(safe-area-inset-left,0px)) 64px}
h1{font-family:"Noto Serif TC",serif;font-weight:500;font-size:clamp(28px,4vw,40px);letter-spacing:.08em;margin:0 0 8px}
.lead{color:var(--muted);margin:0 0 40px;max-width:40em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
a.card{display:flex;flex-direction:column;gap:10px;padding:28px;background:#fff;border:1px solid var(--line);text-decoration:none;color:inherit;transition:border-color .2s}
a.card:hover{border-color:var(--ink)}
.k{font-size:13px;letter-spacing:.2em;font-weight:500}.ka{color:var(--a)}.kb{color:var(--b)}
h2{font-family:"Noto Serif TC",serif;font-weight:500;font-size:24px;margin:0;letter-spacing:.06em}
ul{margin:0;padding-left:1.2em;color:var(--muted);font-size:15px}
.go{margin-top:auto;font-weight:500}
.note{margin-top:40px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
@media (max-width:640px){.grid{grid-template-columns:1fr}main{padding-top:48px}}
</style></head><body><main>
<h1>醫美診所官網 Demo</h1>
<p class="lead">同一家虛構診所、同一份內容，做成兩種方案的網站示範。兩個版本都附「後台操作說明」，示範診所人員如何自行更換圖片、管理文章與上下架療程。</p>
<div class="grid">
<a class="card" href="a/"><span class="k ka">方案 A</span><h2>質感模板客製</h2><ul><li>以質感醫美模板為基礎客製</li><li>標準版型：導覽列、橫幅、卡片與側欄</li><li>整齊好找，維護成本低</li></ul><span class="go">查看方案 A →</span></a>
<a class="card" href="b/"><span class="k kb">方案 B</span><h2>精品客製設計</h2><ul><li>獨立品牌視覺與專屬圖像系統</li><li>非對稱編輯式版面、直排標題</li><li>細緻的換頁、捲動與滑入動態</li></ul><span class="go">查看方案 B →</span></a>
</div>
<p class="note">本網站為設計示範，診所名稱、醫師、地址、電話與執照字號均為虛構；療程說明為一般衛教資訊，不構成醫療建議。</p>
</main></body></html>
